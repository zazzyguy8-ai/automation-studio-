# Render blueprint for Pricebird.
#
# Render reads this from the repository root, which is why it lives here rather
# than next to the app. `rootDir` is what points it at the right one of the two
# apps in this repo - without it Render builds the agency studio.
services:
  - type: web
    name: pricebird
    runtime: node
    # Free spins the instance down after fifteen minutes idle, and the next
    # visitor waits about a minute for it to wake. For a product whose traffic
    # arrives in bursts from a video, that is the difference between a signup
    # and a closed tab. Starter is the smallest plan that stays awake.
    plan: starter
    region: frankfurt
    rootDir: products/pricebird
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Deliberately the landing page, not /api/health: the health endpoint
    # reports 503 until Stripe and the database are configured, which is
    # correct for a human and would make Render fail the very first deploy.
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Generated by Render and never seen by anyone, which is exactly what a
      # cookie-signing key should be.
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://pricebird.org
      # sync:false means "ask me in the dashboard" - these are secrets and must
      # never be committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
